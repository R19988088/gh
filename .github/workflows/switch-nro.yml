name: Switch NRO

on:
  workflow_dispatch:
  push:
    paths:
      - "guardian_heroes/**"
      - "rexglue-sdk-main/**"
      - ".github/workflows/switch-nro.yml"

jobs:
  nvk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Build Mesa NVK Switch SDK
        shell: bash
        run: |
          git clone --depth=1 https://github.com/danfromtico/mesa-switch.git mesa-switch
          chmod +x mesa-switch/build-switch.sh
          (cd mesa-switch && ./build-switch.sh)
          mkdir -p nvk-sdk/lib nvk-sdk/include
          cp mesa-switch/builddir-switch/src/nouveau/vulkan/libvulkan.a nvk-sdk/lib/
          cp -R guardian_heroes/runtime/thirdparty/vulkan-headers/include/vulkan nvk-sdk/include/
          test -s nvk-sdk/lib/libvulkan.a
          test -f nvk-sdk/include/vulkan/vulkan.h
      - name: Upload NVK SDK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-heroes-nvk-sdk
          path: nvk-sdk/
          if-no-files-found: error

  probes:
    runs-on: ubuntu-24.04
    needs: nvk
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v4

      - name: Restore pinned Horizon exception SDK headers
        shell: bash
        run: |
          sdk_dir=toolchains/switch/sources/masseffect-nx/sdk/src/core
          mkdir -p "$sdk_dir"
          git init /tmp/masseffect-nx-sdk
          git -C /tmp/masseffect-nx-sdk remote add origin https://github.com/nebadasSwifty/masseffect-nx.git
          git -C /tmp/masseffect-nx-sdk fetch --depth=1 origin a85b0b419ec3e332165ae1617c980bd399856a44
          git -C /tmp/masseffect-nx-sdk checkout --detach FETCH_HEAD
          cp /tmp/masseffect-nx-sdk/sdk/src/core/resume_ctx.h "$sdk_dir/"
          cp /tmp/masseffect-nx-sdk/sdk/src/core/rex_decode.h "$sdk_dir/"
          test -s "$sdk_dir/resume_ctx.h"
          test -s "$sdk_dir/rex_decode.h"

      - name: Download NVK SDK
        uses: actions/download-artifact@v4
        with:
          name: guardian-heroes-nvk-sdk
          path: nvk-sdk

      - name: Build game NRO
        shell: bash
        working-directory: guardian_heroes
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64
          DEVKITPRO_TOOLS: /opt/devkitpro/tools
          REXGLUE_SWITCH_FFMPEG: /opt/devkitpro/portlibs/switch
          REXGLUE_SWITCH_NVK_SDK: ${{ github.workspace }}/nvk-sdk
        run: |
          source /opt/devkitpro/switchvars.sh
          bash tools/build_switch.sh guardian_heroes_switch_game_nro

      - name: Validate NRO metadata
        shell: bash
        working-directory: guardian_heroes
        run: |
          python3 tools/nro_nacp.py out/build/switch-aarch64-release/guardian_heroes_switch_game.nro 0.1.0

      - name: Upload NRO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guardian-heroes-switch-nros
          if-no-files-found: error
          path: |
            guardian_heroes/out/build/switch-aarch64-release/guardian_heroes_switch_game.nro
            guardian_heroes/out/build/switch-aarch64-release/guardian_heroes_switch_game.nacp

